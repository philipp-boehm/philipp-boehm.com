<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klangfluss</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050510; overflow: hidden; font-family: sans-serif;
            touch-action: none; user-select: none;
        }
        canvas { display: block; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: #fff;
            pointer-events: none; z-index: 10; text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        #btn-start {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; font-size: 18px; background: rgba(0, 255, 200, 0.2);
            color: #00ffcc; border: 1px solid #00ffcc; border-radius: 30px;
            cursor: pointer; transition: 0.3s; z-index: 20;
        }
        #btn-start:hover { background: rgba(0, 255, 200, 0.4); box-shadow: 0 0 20px #00ffcc; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Energie: <span id="score">0</span>%</div>
        <div style="font-size: 12px; color: #888; margin-top: 5px;">Ziehe Linien, um die Partikel in den Wirbel zu leiten.</div>
    </div>
    <button id="btn-start">System aktivieren</button>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('btn-start');
        
        let width, height;
        let audioCtx;
        let isRunning = false;
        
        // Spielobjekte
        let lines = [];
        let particles = [];
        let bursts = [];
        let currentLine = null;
        let score = 0;
        let frameCount = 0;
        
        const emitter = { x: 0, y: 0 };
        const target = { x: 0, y: 0, radius: 40 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            emitter.x = width * 0.15;
            emitter.y = height * 0.15;
            target.x = width * 0.85;
            target.y = height * 0.85;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio-Engine
        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // Reverb Convolver für räumlichen Klang (synthetische Impulsantwort)
            const convolver = audioCtx.createConvolver();
            const rate = audioCtx.sampleRate;
            const length = rate * 2;
            const impulse = audioCtx.createBuffer(2, length, rate);
            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (rate * 0.5));
                impulse.getChannelData(0)[i] = (Math.random() * 2 - 1) * decay;
                impulse.getChannelData(1)[i] = (Math.random() * 2 - 1) * decay;
            }
            convolver.buffer = impulse;
            convolver.connect(audioCtx.destination);
            return convolver;
        }

        let mainEffect;

        function playSound(velocity, lineLength) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Frequenz basierend auf Linienlänge, Lautstärke basierend auf Geschwindigkeit
            const baseFreq = Math.max(100, 1000 - lineLength * 2);
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.type = 'sine';
            
            const vol = Math.min(0.8, velocity * 0.05);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            
            osc.connect(gain);
            gain.connect(mainEffect);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // Vektor-Mathematik & Physik
        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 0;
                this.radius = 3;
                this.life = 1;
                this.color = `hsl(${Math.random() * 40 + 180}, 100%, 70%)`;
            }
            update() {
                this.vy += 0.15; // Gravitation
                this.vx *= 0.99; // Luftwiderstand
                this.vy *= 0.99;
                
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.002;
                
                this.checkCollisions();
            }
            checkCollisions() {
                for (let line of lines) {
                    const lDist = dist(line.x1, line.y1, line.x2, line.y2);
                    const d1 = dist(this.x, this.y, line.x1, line.y1);
                    const d2 = dist(this.x, this.y, line.x2, line.y2);
                    
                    const buffer = 3;
                    if (d1 + d2 >= lDist - buffer && d1 + d2 <= lDist + buffer) {
                        // Kollision erkannt. Vektor-Reflexion.
                        const dx = line.x2 - line.x1;
                        const dy = line.y2 - line.y1;
                        const normal = { x: -dy / lDist, y: dx / lDist };
                        
                        const dot = this.vx * normal.x + this.vy * normal.y;
                        
                        // Nur reflektieren, wenn es sich auf die Linie zubewegt
                        if (dot < 0) {
                            const elasticity = 0.8;
                            this.vx = (this.vx - 2 * dot * normal.x) * elasticity;
                            this.vy = (this.vy - 2 * dot * normal.y) * elasticity;
                            
                            // Aufprallgeschwindigkeit für Sound und Visuals
                            const impactVel = Math.abs(dot);
                            if (impactVel > 1) {
                                playSound(impactVel, lDist);
                                createBurst(this.x, this.y, this.color);
                            }
                            // Anti-Stuck
                            this.x += normal.x * 2;
                            this.y += normal.y * 2;
                        }
                    }
                }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function createBurst(x, y, color) {
            for (let i = 0; i < 8; i++) {
                bursts.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1, color: color
                });
            }
        }

        // Steuerung
        function getPointerPos(e) {
            const evt = e.touches ? e.touches[0] : e;
            return { x: evt.clientX, y: evt.clientY };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isRunning) return;
            const pos = getPointerPos(e);
            currentLine = { x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y, life: 1 };
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isRunning || !currentLine) return;
            const pos = getPointerPos(e);
            currentLine.x2 = pos.x;
            currentLine.y2 = pos.y;
        });

        canvas.addEventListener('pointerup', () => {
            if (!isRunning || !currentLine) return;
            if (dist(currentLine.x1, currentLine.y1, currentLine.x2, currentLine.y2) > 10) {
                lines.push(currentLine);
                if (lines.length > 8) lines.shift(); // Maximale Linienanzahl
            }
            currentLine = null;
        });

        // Rendering & Gameloop
        function render() {
            // Motion Blur / Fade-out Effekt
            ctx.fillStyle = 'rgba(5, 5, 16, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';

            // Emitter
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(emitter.x, emitter.y, 8, 0, Math.PI * 2);
            ctx.fill();

            // Zielwirbel
            const time = Date.now() * 0.002;
            ctx.shadowColor = '#ff00aa';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius - i * 10 + Math.sin(time + i)*5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 0, 170, ${0.3 + i*0.2})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Linien zeichnen
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0088ff';
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            for (let line of lines) {
                ctx.beginPath();
                ctx.moveTo(line.x1, line.y1);
                ctx.lineTo(line.x2, line.y2);
                ctx.stroke();
                line.life -= 0.0005; // Linien verblassen langsam
            }
            lines = lines.filter(l => l.life > 0);

            if (currentLine) {
                ctx.strokeStyle = 'rgba(0, 212, 255, 0.5)';
                ctx.beginPath();
                ctx.moveTo(currentLine.x1, currentLine.y1);
                ctx.lineTo(currentLine.x2, currentLine.y2);
                ctx.stroke();
            }

            // Partikel-Logik
            if (frameCount % 10 === 0) {
                particles.push(new Particle(emitter.x, emitter.y));
            }

            ctx.shadowBlur = 15;
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                ctx.shadowColor = p.color;
                p.draw(ctx);
                
                // Ziel-Kollision
                if (dist(p.x, p.y, target.x, target.y) < target.radius) {
                    score += 1;
                    scoreEl.innerText = score;
                    createBurst(p.x, p.y, '#ff00aa');
                    if(audioCtx) {
                        const osc = audioCtx.createOscillator();
                        osc.frequency.value = 600 + Math.random() * 400;
                        osc.connect(mainEffect);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.1);
                    }
                    particles.splice(i, 1);
                    continue;
                }
                
                if (p.x < 0 || p.x > width || p.y > height || p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Bursts (Explosionen)
            ctx.shadowBlur = 0;
            for (let i = bursts.length - 1; i >= 0; i--) {
                let b = bursts[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life -= 0.05;
                ctx.fillStyle = b.color;
                ctx.globalAlpha = Math.max(0, b.life);
                ctx.fillRect(b.x, b.y, 2, 2);
                if (b.life <= 0) bursts.splice(i, 1);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            frameCount++;
            if (isRunning) requestAnimationFrame(render);
        }

        startBtn.addEventListener('click', () => {
            if (!audioCtx) mainEffect = initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            startBtn.style.display = 'none';
            isRunning = true;
            render();
        });
    </script>
</body>
</html>
