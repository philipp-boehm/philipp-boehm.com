name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Code aus dem Repo holen
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Node.js Umgebung aufsetzen
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. Abhängigkeiten installieren & Seite bauen
    - name: Install & Build
      run: |
        npm ci
        npm run build
      # Das Ergebnis liegt nun standardmäßig im Ordner 'dist/'

    # 4. Upload per reinem SFTP (Keine Shell-Befehle nötig)
    - name: Deploy via SCP/SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        source: "dist/*"
        target: "/www/portfolio"
        strip_components: 1